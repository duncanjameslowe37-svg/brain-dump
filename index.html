<!doctype html><html lang="en-GB"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Brain Dump</title><meta name="theme-color" content="#f7f7f8">
<meta name="description" content="Dump any thought. It sorts itself.">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<script>document.documentElement.dataset.theme=localStorage.getItem('bd.theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')</script>
<link rel="stylesheet" href="style.css?v=2"></head>
<body>
<header class="top"><div class="brand"><h1>Brain Dump</h1><p id="greet">&nbsp;</p></div>
<div class="hbtns"><button class="ib" id="searchBtn" aria-label="Search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
<button class="ib" id="themeBtn" aria-label="Toggle dark mode"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
<button class="ib" id="menuBtn" aria-label="Menu"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg></button></div></header>
<div id="searchBar" hidden><input id="search" type="search" placeholder="Search everything" autocomplete="off" enterkeyhint="search"></div>
<nav id="tabs" role="tablist"></nav>
<main id="list" aria-live="polite"></main>
<form id="dump" autocomplete="off"><div id="preview" aria-live="polite"></div><div class="inrow">
<textarea id="input" rows="1" placeholder="What's on your mind?" enterkeyhint="done" aria-label="New entry"></textarea>
<button type="button" class="ib" id="mic" aria-label="Speak"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
<button type="submit" id="send" aria-label="Add" disabled><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button></div></form>
<div id="sheet" class="sheet" hidden><div class="scrim" data-close></div><div class="panel" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status"><span></span><button type="button" hidden></button></div>
<script src="classifier.js?v=2"></script><script src="app.js?v=2"></script></body></html>
