<!doctype html><html lang="en-GB"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Brain Dump</title><meta name="theme-color" content="#f5f5f7">
<meta name="description" content="Dump any thought. It sorts itself.">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Brain Dump"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<script>document.documentElement.dataset.theme=localStorage.getItem('bd.theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')</script>
<link rel="stylesheet" href="style.css?v=3c"></head>
<body>
<header class="top"><div class="brand"><h1 id="title">Today</h1><p id="sub">&nbsp;</p></div>
<div class="hbtns"><button class="ib" id="searchBtn" aria-label="Search"></button><button class="ib" id="themeBtn" aria-label="Toggle dark mode"></button><button class="ib" id="menuBtn" aria-label="Menu"></button></div></header>
<div id="searchBar" hidden><input id="search" type="search" placeholder="Search everything" autocomplete="off" enterkeyhint="search" aria-label="Search"></div>
<nav id="tabs" role="tablist" aria-label="Views"></nav>
<main id="list" aria-live="polite"></main>
<form id="dump" autocomplete="off"><div id="preview" aria-live="polite"></div><div class="inrow">
<div class="normal"><textarea id="input" rows="1" placeholder="What’s on your mind?" enterkeyhint="done" aria-label="New entry"></textarea>
<button type="button" class="ib" id="cam" aria-label="Snap paperwork"></button><button type="button" class="ib" id="mic" aria-label="Record voice note (tap or hold)"></button>
<button type="submit" id="send" aria-label="Add" disabled></button></div>
<div class="recui"><button type="button" class="ib" id="recCancel" aria-label="Discard recording"></button><div class="recmid"><canvas id="wave" aria-hidden="true"></canvas><div class="recinfo"><span class="dot"></span><span id="recTime">0:00</span><span id="recText"></span></div></div><button type="button" id="recStop" aria-label="Save voice note"></button></div>
</div><input type="file" id="snapFile" accept="image/*" capture="environment" hidden></form>
<div id="sheet" class="sheet" hidden><div class="scrim" data-close></div><div class="panel" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status"><span></span><button type="button" hidden></button></div>
<script src="icons.js?v=3c"></script><script src="classifier.js?v=3c"></script><script src="insights.js?v=3c"></script><script src="cal.js?v=3c"></script><script src="store.js?v=3c"></script><script src="sync.js?v=3c"></script><script src="snap.js?v=3c"></script><script src="app.js?v=3c"></script></body></html>
